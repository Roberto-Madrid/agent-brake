name: core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_package.py
      - run: python scripts/demo.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/
  claude-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes --package @anthropic-ai/claude-code@2.1.285 claude plugin validate --strict .
      - run: npx --yes --package @anthropic-ai/claude-code@2.1.285 claude plugin validate --strict .claude-plugin/plugin.json
      - run: npx --yes --package @anthropic-ai/claude-code@2.1.285 -c 'python scripts/verify_hosts.py --claude claude'

