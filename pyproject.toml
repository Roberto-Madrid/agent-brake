[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-police"
version = "0.4.0"
description = "Deterministic agent usage accounting and bounded cost controls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Roberto Madrid"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
agentbrake = "token_police.cli:main"
token-police = "token_police.cli:main"

[tool.setuptools.packages.find]
include = ["token_police*"]

